
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой магазин</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>НАЗВАНИЕ МАГАЗИНА</h1>
</header>

<h2>ПРОДУКТЫ</h2>

<div class="shop">

    <aside class="sidebar">
        <h3>БРЕНД</h3>
        <button class="active" onclick="filter('all', this)">Все</button>
        <button onclick="filter('apple', this)">Apple</button>
        <button onclick="filter('samsung', this)">Samsung</button>
        <button onclick="filter('xiaomi', this)">Xiaomi</button>

        <h3 style="margin-top:25px">ЦЕНА</h3>
        <button onclick="sortPrice()">Сначала дешевле</button>
    </aside>

    <main class="products" id="products">

        <div class="product" data-brand="apple" data-price="90000">
            <img src="https://placehold.co/300x180/e8ece9/344d43?text=iPhone">
            <h3>iPhone</h3>
            <p class="price">90 000 ₽</p>
            <button onclick="addCart('iPhone', 90000)">В корзину</button>
        </div>

        <div class="product" data-brand="samsung" data-price="75000">
            <img src="https://placehold.co/300x180/e8ece9/344d43?text=Samsung">
            <h3>Samsung Galaxy</h3>
            <p class="price">75 000 ₽</p>
            <button onclick="addCart('Samsung Galaxy', 75000)">В корзину</button>
        </div>

        <div class="product" data-brand="xiaomi" data-price="35000">
            <img src="https://placehold.co/300x180/e8ece9/344d43?text=Xiaomi">
            <h3>Xiaomi</h3>
            <p class="price">35 000 ₽</p>
            <button onclick="addCart('Xiaomi', 35000)">В корзину</button>
        </div>

        <div class="product" data-brand="apple" data-price="120000">
            <img src="https://placehold.co/300x180/e8ece9/344d43?text=iPad">
            <h3>iPad</h3>
            <p class="price">120 000 ₽</p>
            <button onclick="addCart('iPad', 120000)">В корзину</button>
        </div>

        <div class="product" data-brand="samsung" data-price="50000">
            <img src="https://placehold.co/300x180/e8ece9/344d43?text=Galaxy+Watch">
            <h3>Galaxy Watch</h3>
            <p class="price">50 000 ₽</p>
            <button onclick="addCart('Galaxy Watch', 50000)">В корзину</button>
        </div>

        <div class="product" data-brand="xiaomi" data-price="15000">
            <img src="https://placehold.co/300x180/e8ece9/344d43?text=Headphones">
            <h3>Наушники Xiaomi</h3>
            <p class="price">15 000 ₽</p>
            <button onclick="addCart('Наушники Xiaomi', 15000)">В корзину</button>
        </div>

    </main>
</div>

<div class="cart">
    <h3>🛒 Корзина</h3>
    <p id="cartText">Товаров: 0 | Сумма: 0 ₽</p>
</div>

<script>
let count = 0;
let total = 0;

function filter(brand, button) {
    document.querySelectorAll('.product').forEach(item => {
        item.style.display =
            brand === 'all' || item.dataset.brand === brand
            ? 'flex' : 'none';
    });

    document.querySelectorAll('.sidebar button').forEach(btn => {
        btn.classList.remove('active');
    });

    button.classList.add('active');
}

function sortPrice() {
    const container = document.getElementById('products');
    const items = [...container.children];

    items.sort((a, b) =>
        Number(a.dataset.price) - Number(b.dataset.price)
    );

    items.forEach(item => container.appendChild(item));
}

function addCart(name, price) {
    count++;
    total += price;

    document.getElementById('cartText').textContent =
        `Товаров: ${count} | Сумма: ${total.toLocaleString('ru-RU')} ₽`;
}
</script>

</body>
</html>
